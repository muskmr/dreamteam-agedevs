name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/api
      - run: npm run build -w packages/web

  smoke:
    name: Smoke (mock Ollama)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/api
      - name: Start mock Ollama
        run: |
          node <<'JS' >/tmp/mock-ollama.log 2>&1 &
          const http = require("http");
          const server = http.createServer((req, res) => {
            if (req.url === "/api/tags") {
              res.writeHead(200, { "Content-Type": "application/json" });
              res.end(JSON.stringify({ models: [{ name: "llama3.2" }] }));
              return;
            }
            if (req.url === "/api/chat" && req.method === "POST") {
              let body = "";
              req.on("data", (c) => (body += c));
              req.on("end", () => {
                res.writeHead(200, { "Content-Type": "application/json" });
                res.end(
                  JSON.stringify({
                    message: {
                      role: "assistant",
                      content: "# Design\nMock design from CI.\n",
                    },
                  }),
                );
              });
              return;
            }
            res.writeHead(404);
            res.end();
          });
          server.listen(11434, "127.0.0.1");
          JS
          echo $! > /tmp/mock-ollama.pid
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:11434/api/tags && break
            sleep 0.25
          done
      - name: Start API
        run: |
          (cd packages/api && \
            PORT=3001 \
            OLLAMA_URL=http://127.0.0.1:11434 \
            OLLAMA_MODEL=llama3.2 \
            HOST_OS_LABEL="github-actions" \
            node dist/index.js) >/tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:3001/api/health && break
            sleep 0.25
          done
          curl -sf http://127.0.0.1:3001/api/health | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          grep -q '"ollama":true' /tmp/health.json
      - name: Create project + designer prompt
        run: |
          NAME="ci-$GITHUB_RUN_ID"
          curl -sf -X POST http://127.0.0.1:3001/api/projects \
            -H 'Content-Type: application/json' \
            -d "{\"name\":\"$NAME\"}"
          curl -sf -X POST "http://127.0.0.1:3001/api/projects/$NAME/prompt" \
            -H 'Content-Type: application/json' \
            -d '{"prompt":"CI mock design please"}' | tee /tmp/prompt.json
          grep -q 'waiting_user\|completed\|Design' /tmp/prompt.json
      - name: Cleanup
        if: always()
        run: |
          kill "$(cat /tmp/api.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat /tmp/mock-ollama.pid 2>/dev/null)" 2>/dev/null || true
